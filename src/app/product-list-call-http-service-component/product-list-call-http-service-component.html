<p>product-list-call-http-service-component works!</p>
<table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      @for (p of products(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>
            <img [src]="p.image" [alt]="p.name" width="60" height="60" />
          </td>
          <td>{{ p.name }}</td>
          <td>{{ p.price }}</td>
        </tr>
      }
      @empty {
        <tr>
          <td colspan="4">Not found product!</td>
        </tr>
      }
    </tbody>
  </table>
