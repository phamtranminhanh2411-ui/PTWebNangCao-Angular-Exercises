<p>Go to component</p>
<p>{{ errMessage() }}</p>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">No products available.</td>
      </tr>
    }
  </tbody>
</table>
